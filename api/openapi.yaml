openapi: 3.0.3
info:
  title: TaskForge для Выполнения задач(в будущем)
  description: API, который создает отчеты по задачам, которые передаются HTTP запросом
  version: 1.0.0
servers: 
  - url: http://localhost:8080

paths:
  /health:
    get:
      summary: Проверить доступность API
      operationId: getHealth
      responses:
        '200':
          description: Получение данных о состоянии сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /tasks/{id}:
    get:
      summary: Получить отчёт по задаче
      operationId: getTask
      parameters:
       - $ref: '#/components/parameters/IdPath'
      responses:
        '200':
          description: Успешное получение статуса задачи
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTaskResponse'
        '404':
          description: Не найдено задачи с таким ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tasks:
    post:
      summary: Выложить задачу, которую потом обработает сервер
      operationId: postTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTaskRequest'
      responses:
        '202':
          description: Успешная загрузка задачи с id внутри
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTaskResponse'
        '400':
          description: Некорректный формат входящих данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  parameters:
    IdPath:
      name: id
      in: path
      required: true
      description: ID задачи в UUID
      schema:
        type: string
        format: uuid
  schemas:
    HealthResponse:
      type: object
      required: [status, response_time_ms]
      properties:
        status:
          type: string
          enum:
            - ok
        response_time_ms:
          type: integer
          minimum: 0
    GetTaskResponse:
      type: object
      required: [id, status, attempts, created_at, started_at, finished_at, result, error]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
            - running
            - completed
            - failed
        attempts:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
          nullable: true
        finished_at:
          type: string
          format: date-time
          nullable: true
        result:
          $ref: '#/components/schemas/Result'
        error:
            $ref: '#/components/schemas/TaskError'
    PostTaskRequest:
      type: object
      required: [report_type,parameters]
      properties:
        report_type:
          type: string
          enum:
            - summary
        parameters:
          type: object
          required: [period_days]
          properties:
            period_days:
              type: integer
              minimum: 1
              maximum: 365
    PostTaskResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
        created_at:
          type: string
          format: date-time
    Result:
      type: object
      nullable: true
      required: [summary]
      properties: 
        summary:
          type: string      
    TaskError:
      type: object
      required: [message]
      nullable: true
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          type: string
          description: Дополнительная информация
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          type: string
          description: Дополнительная информация



