openapi: 3.0.3
info:
  title: TaskForge для Выполнения задач(в будущем)
  description: API, который создает отчеты по задачам, которые передаются HTTP запросом
  version: 1.0.0
servers: 
  - url: http://localhost:8080

paths:
  /tasks:
    post:
      summary: Выложить задачу, которую потом обработает сервер
      operationId: postTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostTaskRequest'
      responses:
        '202':
          description: Успешная загрузка задачи с id внутри
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostTaskResponse'
        '400':
          description: Некорректный формат входящих данных
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Внутренняя ошибка сервера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    PostTaskRequest:
      type: object
      required: [report_type,parameters]
      properties:
        report_type:
          type: string
          enum:
            - summary
        parameters:
          type: object
          required: [period_days]
          properties:
            period_days:
              type: integer
              minimum: 1
              maximum: 365
    PostTaskResponse:
      type: object
      required: [id, status, created_at]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - pending
        created_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
          description: Человекочитаемое описание ошибки
        details:
          type: string
          description: Дополнительная информация



